plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.dya.azadalkrd"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    namespace 'com.dya.azadalkrd'
}

flutter {
    source '../..'
}

def adhanRawDir = file("src/main/res/raw")
def adhanSourceDir = file("../../lib/assets/bang")
task copyAdhanToRaw {
    doLast {
        adhanRawDir.mkdirs()
        def names = [
            ["bang_1.mp3", "adhan1.mp3"], ["bang_2.mp3", "adhan2.mp3"], ["bang_3.mp3", "adhan3.mp3"],
            ["bang_4.mp3", "adhan4.mp3"], ["bang_5.mp3", "adhan_5.mp3"], ["bang_6.mp3", "adhan_6.mp3"],
            ["bang_7.mp3", "adhan_7.mp3"], ["bang_8.mp3", "adhan_8.mp3"], ["bang_9.mp3", "adhan_9.mp3"],
            ["bang_10.mp3", "adhan_10.mp3"], ["bang_11.mp3", "adhan_11.mp3"], ["bang_12.mp3", "adhan_12.mp3"],
            ["bang_13.mp3", "adhan_13.mp3"], ["bang_14.mp3", "adhan_14.mp3"]
        ]
        names.each { fromTo ->
            def src = new File(adhanSourceDir, fromTo[0])
            if (src.exists()) {
                copy {
                    from src
                    into adhanRawDir
                    rename { name -> name == fromTo[0] ? fromTo[1] : name }
                }
            }
        }
    }
}
tasks.whenTaskAdded { task ->
    if (task.name == "mergeReleaseResources" || task.name == "mergeDebugResources") {
        task.dependsOn copyAdhanToRaw
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.10"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
