name: the_open_quran
description: "أوقات الأذان آزاد الكُردي — Qur'an and prayer times"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  #Localications
  flutter_localizations:
    sdk: flutter
  flutter_gen:
    path: packages/flutter_gen
  intl: 0.20.2

  #State Managements
  provider: ^6.0.3                                        # Provide state management
  rxdart: ^0.28.0

  #Network
  http: ^1.1.0
  html: ^0.15.1


  # Google
  google_fonts: ^8.0.1                                    # Text fonts

  # Widgets
  cupertino_icons: ^1.0.2                                 # Cupertino icons
  flashy_tab_bar2: ^0.0.10                                # Animated bottom nav bar
  flutter_svg: ^2.0.7                                     # Reading SVG images
  auto_size_text: ^3.0.0
  custom_sliding_segmented_control: ^1.7.2
  syncfusion_flutter_sliders: ^32.2.4
  scrollable_positioned_list: ^0.3.5
  gap: ^3.0.1                                             # Adding gaps between widgets
  flutter_slidable: ^4.0.3                                # Slidable list item
  home_widget: ^0.7.0

  # Local Database
  get_storage: ^2.0.3                                     # Store data locally
  sqflite: ^2.4.0                                         # SQLite for dhikr DB
  sqflite_common_ffi: ">=2.3.7 <2.4.0"                    # SQLite on desktop (pinned for Dart 3.9)
  sqlite3: ^2.9.4                                         # Required by sqflite_common_ffi 2.3.x (Dart 3.9)
  sqlite3_flutter_libs: ^0.5.41                              # Native SQLite libs for Flutter (0.5.x for Dart <3.10)

  #Helpers
  flutter_native_splash: ^2.2.10+1                        # Native Splash
  package_info_plus: 8.3.0
  path_provider: ^2.0.11
  equatable: ^2.0.5
  html_character_entities: ^1.0.0+1
  share_plus: 10.1.4
  device_info_plus: 11.3.0
  in_app_review: ^2.0.6
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.1.10
  permission_handler: ^12.0.1
  modal_bottom_sheet: ^3.0.0-pre
  dartarabic: ^0.3.1
  table_calendar: ^3.2.0
  # pdfx: ^2.9.2  # Temporarily disabled for Windows build (CMake/Vcxproj failures).
  universal_platform: ^1.0.0+1
  audioplayers: ^6.0.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_compass: ^0.8.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  shimmer: ^3.0.0
  hijri: ^3.0.0
  vibration: ^3.1.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  image_path_ios: 'lib/assets/m azad logo.png'
  image_path_android: 'lib/assets/m azad logo.png'
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/json/
    - assets/recitations/bundled/
    - assets/json/translations/
    - assets/surahSVG/
    - assets/audio/
    - lib/assets/
    # Explicit DBs so they are always listed in the asset manifest (Kurdistan vs IQ/IR).
    - lib/assets/kurdistandb.sqlite
    - lib/assets/pdfbooks/
    - lib/assets/thikrs/
    - lib/assets/athkars2.svg

  fonts:
    - family: UthmaniIcon
      fonts:
        - asset: assets/fonts/UthmanicRegular.ttf
    - family: Uthmani
      fonts:
        - asset: assets/fonts/UthmanTN_v2-0.ttf
    - family: Uthmanic Bold
      fonts:
        - asset: assets/fonts/UthmanicBold.ttf
    - family: Majeed
      fonts:
        - asset: assets/fonts/AlMajeed.ttf
    - family: Me
      fonts:
        - asset: assets/fonts/Me.ttf
    - family: Kufam Regular
      fonts:
        - asset: assets/fonts/KufamRegular.ttf
    - family: Noore
      fonts:
        - asset: assets/fonts/Noore.ttf
    - family: Naskh
      fonts:
        - asset: assets/fonts/Naskh.ttf
    - family: Quran Font
      fonts:
        - asset: assets/fonts/QuranFont.ttf
    - family: Tinos
      fonts:
        - asset: assets/fonts/Tinos.ttf
    - family: SurahNames
      fonts:
        - asset: lib/assets/surah_names.ttf
    - family: UniQAIDAR_OSMAN
      fonts:
        - asset: lib/assets/font/UniQAIDAR_OSMAN.ttf