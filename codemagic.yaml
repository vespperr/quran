workflows:
  ios-trollstore-release:
    name: iOS TrollStore IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Release Mode for TrollStore - Target iOS 15)
        script: |
          # Set deployment target to iOS 15.0 and build release IPA
          IPHONEOS_DEPLOYMENT_TARGET=15.0 flutter build ios --release --no-codesign
          
          # Create IPA package manually for TrollStore installation
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Raiyan_TrollStore.ipa Payload

          # Copy IPA to artifact folder inside the same script step
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp Raiyan_TrollStore.ipa $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
