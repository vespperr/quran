workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS App & Extension
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA for TrollStore
        script: |
          # Embed App Group entitlements into Mach-O binaries for TrollStore
          if [ -d "build/ios/iphoneos/Runner.app/PlugIns/PrayerWidgetExtension.appex" ]; then
            codesign --force --deep --sign - --entitlements ios/PrayerWidgetExtension/PrayerWidgetExtension.entitlements build/ios/iphoneos/Runner.app/PlugIns/PrayerWidgetExtension.appex
          fi
          codesign --force --deep --sign - --entitlements ios/Runner/Runner.entitlements build/ios/iphoneos/Runner.app

          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr TheOpenQuran.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp TheOpenQuran.ipa $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
