workflows:
  ios-trollstore-release:
    name: iOS TrollStore IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Release Mode for TrollStore - iOS 15 Target)
        script: |
          set -e
          flutter clean
          flutter packages pub get

          # Force Xcode minimum deployment target to 15.0 to avoid missing private frameworks on iOS 15
          find ios/ -name "*.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' {} +

          # Build iOS release app targeting iOS 15.0 compatibility
          IPHONEOS_DEPLOYMENT_TARGET=15.0 flutter build ios --release --no-codesign

          # Create Payload structure and package IPA for TrollStore
          cd build/ios/iphoneos
          rm -rf Payload Raiyan_TrollStore.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Raiyan_TrollStore.ipa Payload

          # Copy IPA to root directory for artifact collection
          cp Raiyan_TrollStore.ipa $CM_BUILD_DIR/
    artifacts:
      - *.ipa
