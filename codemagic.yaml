workflows:
  ios-release:
    name: iOS Release Build (iOS 15.1 Target)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Targeting iOS 15.1)
        script: |
          # Force deployment target to 15.1 and weak-link _LocationEssentials for iOS 15 compatibility
          IPHONEOS_DEPLOYMENT_TARGET=15.1 flutter build ios --release --no-codesign OTHER_LDFLAGS="-weak_framework _LocationEssentials"
          
          # Create IPA payload package
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r TheOpenQuran.ipa Payload
          
          # Copy to root artifacts folder
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp TheOpenQuran.ipa $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.app
