workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          
          # Create IPA package
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r TheOpenQuran.ipa Payload
          
          # Copy to root artifacts folder
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp TheOpenQuran.ipa $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
