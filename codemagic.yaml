workflows:
  ios-release:
    name: iOS Release Build (iOS 15.1 Target)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS IPA (Targeting iOS 15.1)
        script: |
          IPHONEOS_DEPLOYMENT_TARGET=15.1 flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
